<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Tree Pipeline WebApp</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 180px; }
        #svg-container {
            margin-top: 10px; border: 1px solid #ccc; padding: 0;
            overflow: hidden; min-height: 200px; height: 70vh;
            cursor: grab; user-select: none; position: relative;
            background: #fafafa;
        }
        #svg-container.empty { display: flex; align-items: center; justify-content: center; cursor: default; }
        #svg-wrapper { display: inline-block; transform-origin: 0 0; }
        #status { font-weight: bold; margin-bottom: 10px; padding: 10px; background: #eee; border-radius: 4px; }
        #status.ready { background: #dfd; color: #060; }
        #status.error { background: #fdd; color: #c00; }
        .section-title { font-weight: bold; margin-top: 20px; margin-bottom: 10px; border-bottom: 1px solid #ccc; }
        .optional { color: #666; font-size: 0.9em; }

        /* ── Pipeline progress ──────────────────────────────────────────── */
        #progress-section { display: none; margin: 8px 0 14px; }
        .step-chips { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
        .step-chip {
            padding: 3px 12px; border-radius: 12px; font-size: 0.78em; font-weight: 600;
            background: #e0e0e0; color: #777; transition: background 0.3s, color 0.3s;
        }
        .step-chip.active { background: #007bff; color: #fff; animation: chip-pulse 1.2s infinite; }
        .step-chip.done   { background: #28a745; color: #fff; animation: none; }
        @keyframes chip-pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
        .progress-track { height: 7px; background: #ddd; border-radius: 4px; overflow: hidden; }
        #progress-bar   { height: 100%; width: 0%; background: #007bff;
                          border-radius: 4px; transition: width 0.4s ease; }
        #log-line { font-size: 0.78em; color: #555; font-family: monospace;
                    margin-top: 4px; min-height: 1.2em; }

        /* ── Buttons ────────────────────────────────────────────────────── */
        .btn { padding: 8px 18px; font-size: 1em; cursor: pointer;
               border: none; border-radius: 4px; transition: opacity 0.2s; }
        .btn:disabled { opacity: 0.5; cursor: default; }
        .btn-primary { background: #007bff; color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #0069d9; }
        .btn-demo    { background: #6c757d; color: #fff; margin-left: 8px; }
        .btn-demo:hover:not(:disabled) { background: #5a6268; }
        .btn-sm { padding: 5px 12px; font-size: 0.85em; margin-left: 0; }

        /* ── Demo loaded badge ──────────────────────────────────────────── */
        .demo-tag { font-size: 0.75em; color: #28a745; margin-left: 6px;
                    font-weight: 600; display: none; }

        /* ── Plot toolbar ───────────────────────────────────────────────── */
        #plot-toolbar {
            display: none; margin: 10px 0 4px; gap: 8px;
            flex-wrap: wrap; align-items: center;
        }
        #plot-toolbar .hint { color: #999; font-size: 0.8em; margin-left: 4px; }
    </style>
</head>
<body>
    <h1>Tree Pipeline</h1>
    <div id="status">Loading Pyodide and packages…</div>

    <!-- Pipeline progress (visible during run) -->
    <div id="progress-section">
        <div class="step-chips">
            <div class="step-chip" id="chip-a">A: Build Tree</div>
            <div class="step-chip" id="chip-b">B: Label Clones</div>
            <div class="step-chip" id="chip-c">C: Annotate SVG</div>
        </div>
        <div class="progress-track"><div id="progress-bar"></div></div>
        <div id="log-line"></div>
    </div>

    <div class="section-title">Inputs</div>
    <div class="form-group">
        <label>Newick File (*):</label>
        <input type="file" id="newick_file" accept=".nwk,.tre">
        <span class="demo-tag" id="tag-newick">✓ demo</span>
    </div>
    <div class="form-group">
        <label>Clone Map (CSV/TSV):</label>
        <input type="file" id="clone_map" accept=".csv,.tsv">
        <span class="demo-tag" id="tag-clone">✓ demo</span>
    </div>
    <div class="form-group">
        <label>Color Map:</label>
        <input type="file" id="color_map" accept=".txt,.csv,.tsv">
        <span class="demo-tag" id="tag-color">✓ demo</span>
    </div>
    <div class="form-group">
        <label>cgMLST File:</label>
        <input type="file" id="cgmlst_file" accept=".tsv,.csv">
    </div>
    <div class="form-group">
        <label>Batches File:</label>
        <input type="file" id="batches_file" accept=".tsv,.csv">
    </div>

    <div class="section-title">Layout Options</div>
    <div class="form-group">
        <label>Width:</label>
        <input type="number" id="width" value="2500" placeholder="e.g. 2500">
    </div>
    <div class="form-group">
        <label>Height:</label>
        <input type="number" id="height" value="1500" placeholder="e.g. 1500">
    </div>
    <div class="form-group">
        <label>Legend X:</label>
        <input type="number" id="legend_x" value="1100" placeholder="e.g. 1100">
    </div>
    <div class="form-group">
        <label>Legend Y:</label>
        <input type="number" id="legend_y" value="100" placeholder="e.g. 100">
    </div>
    <div class="form-group">
        <label>Branch Label Font Size:</label>
        <input type="number" id="branch_font_size" value="26" min="0" max="200" placeholder="e.g. 26">
    </div>
    <div class="form-group">
        <label>Node Label Font Size:</label>
        <input type="number" id="node_font_size" value="12" min="0" max="200" placeholder="e.g. 12">
    </div>
    <div class="form-group">
        <label>Branch Width (px):</label>
        <input type="number" id="branch_stroke_width" value="3" min="1" max="30" step="0.5" placeholder="e.g. 3">
    </div>
    <div class="form-group">
        <label>Branch Length Scale:</label>
        <select id="distance_scale">
            <option value="log" selected>Log (default — compresses long branches)</option>
            <option value="sqrt">Sqrt (moderate spread)</option>
            <option value="linear">Linear (true proportional lengths)</option>
        </select>
    </div>
    <div class="form-group">
        <label>Remove Samples Text:</label>
        <input type="checkbox" id="remove_samples_text">
    </div>

    <div class="section-title">Load Saved Plot</div>
    <div class="form-group">
        <label>Load JSON Plot:</label>
        <input type="file" id="load_json_input" accept=".json">
        <button id="load_json_btn" class="btn btn-demo btn-sm">Load JSON</button>
    </div>

    <div class="form-group" style="margin-top: 20px;">
        <button id="run_btn"  class="btn btn-primary" disabled>Run Pipeline</button>
        <button id="demo_btn" class="btn btn-demo"    disabled>Load Demo Data</button>
    </div>

    <!-- Plot toolbar: shown after a plot is loaded/generated -->
    <div id="plot-toolbar">
        <button onclick="downloadSVG()" class="btn btn-primary btn-sm">&#8595; SVG</button>
        <button onclick="downloadPNG()" class="btn btn-primary btn-sm">&#8595; PNG</button>
        <button onclick="savePlotJSON()" class="btn btn-primary btn-sm">&#128190; Save JSON</button>
        <button onclick="resetView()" class="btn btn-demo btn-sm">&#8634; Reset View</button>
        <span class="hint">Scroll to zoom &middot; Drag to pan</span>
    </div>

    <div id="svg-container" class="empty">
        <i>Output will appear here.</i>
    </div>

    <script>
        // ── Globals ───────────────────────────────────────────────────────────
        let currentSvgContent = '';
        let viewState = { scale: 1, tx: 0, ty: 0 };
        let dragState = { active: false, startX: 0, startY: 0, startTx: 0, startTy: 0 };

        // ── Status helper ─────────────────────────────────────────────────────
        function setStatus(msg, cls) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = cls || '';
        }

        // ── Pipeline progress helpers ─────────────────────────────────────────
        let _curChip = null;
        let _barPct  = 0;

        function _chipDone(id) {
            const el = document.getElementById(id);
            if (el) el.className = 'step-chip done';
        }

        function _chipActive(id) {
            if (_curChip && _curChip !== id) _chipDone(_curChip);
            _curChip = id;
            const el = document.getElementById(id);
            if (el) el.className = 'step-chip active';
        }

        function _setBar(pct) {
            _barPct = pct;
            document.getElementById('progress-bar').style.width = pct + '%';
        }

        function _resetProgress() {
            _curChip = null; _barPct = 0;
            ['chip-a', 'chip-b', 'chip-c'].forEach(id => {
                document.getElementById(id).className = 'step-chip';
            });
            _setBar(0);
            document.getElementById('log-line').textContent = '';
            document.getElementById('progress-section').style.display = 'block';
        }

        function _finishProgress() {
            if (_curChip) { _chipDone(_curChip); _curChip = null; }
            _setBar(100);
        }

        // Called from Python stdout redirect
        window.updatePipelineProgress = function(msg) {
            document.getElementById('log-line').textContent = msg;
            if      (msg.includes('Stage A'))       { _chipActive('chip-a'); _setBar(5);  }
            else if (msg.includes('laid out'))      { _setBar(28); }
            else if (msg.includes('Stage B'))       { _chipActive('chip-b'); _setBar(36); }
            else if (msg.includes('Stage C'))       { _chipActive('chip-c'); _setBar(50); }
            else if (msg.includes('multi-sample')   ||
                     msg.includes('#loci')          || msg.includes('Loci')   ||
                     msg.includes('lour')           || msg.includes('batch')  ||
                     msg.includes('Batch')          || msg.includes('text label')) {
                if (_barPct >= 50 && _barPct < 88) _setBar(_barPct + 8);
            }
            else if (msg.includes('Created'))       { _setBar(92); }
            else if (msg.includes('Done.'))         { _finishProgress(); }
        };

        // ── Plot display and view helpers ─────────────────────────────────────
        function showPlot(svg) {
            currentSvgContent = svg;
            const container = document.getElementById('svg-container');
            container.innerHTML = '';
            container.classList.remove('empty');
            container.style.cursor = 'grab';
            const wrapper = document.createElement('div');
            wrapper.id = 'svg-wrapper';
            wrapper.style.display = 'inline-block';
            wrapper.style.transformOrigin = '0 0';
            wrapper.innerHTML = svg;
            container.appendChild(wrapper);
            viewState = { scale: 1, tx: 0, ty: 0 };
            document.getElementById('plot-toolbar').style.display = 'flex';
        }

        function applyTransform() {
            const wrapper = document.getElementById('svg-wrapper');
            if (wrapper) {
                wrapper.style.transform =
                    `translate(${viewState.tx}px, ${viewState.ty}px) scale(${viewState.scale})`;
            }
        }

        function resetView() {
            viewState = { scale: 1, tx: 0, ty: 0 };
            applyTransform();
        }

        // ── Download / Save helpers ───────────────────────────────────────────
        function downloadSVG() {
            if (!currentSvgContent) return;
            const blob = new Blob([currentSvgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'annotated.svg'; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function downloadPNG() {
            const svgEl = document.querySelector('#svg-container svg');
            if (!svgEl) return;
            const data = new XMLSerializer().serializeToString(svgEl);
            const svgBlob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);
            const img = new Image();
            img.onload = function() {
                const w = parseInt(svgEl.getAttribute('width') || 800);
                const h = parseInt(svgEl.getAttribute('height') || 600);
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, w, h);
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                const a = document.createElement('a');
                a.download = 'annotated.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
            img.src = url;
        }

        function savePlotJSON() {
            if (!currentSvgContent) return;
            const plotData = { svg: currentSvgContent, savedAt: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(plotData, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = 'tree_plot.json'; a.click();
        }

        // ── Zoom / Pan ────────────────────────────────────────────────────────
        const svgContainer = document.getElementById('svg-container');

        svgContainer.addEventListener('wheel', (e) => {
            if (!document.getElementById('svg-wrapper')) return;
            e.preventDefault();
            const delta = e.deltaY < 0 ? 1.1 : 0.9;
            const rect = svgContainer.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            viewState.tx = mx + (viewState.tx - mx) * delta;
            viewState.ty = my + (viewState.ty - my) * delta;
            viewState.scale *= delta;
            applyTransform();
        }, { passive: false });

        svgContainer.addEventListener('mousedown', (e) => {
            if (!document.getElementById('svg-wrapper')) return;
            if (e.button !== 0) return;
            dragState = { active: true, startX: e.clientX, startY: e.clientY,
                          startTx: viewState.tx, startTy: viewState.ty };
            svgContainer.style.cursor = 'grabbing';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!dragState.active) return;
            viewState.tx = dragState.startTx + (e.clientX - dragState.startX);
            viewState.ty = dragState.startTy + (e.clientY - dragState.startY);
            applyTransform();
        });

        document.addEventListener('mouseup', () => {
            if (!dragState.active) return;
            dragState.active = false;
            if (document.getElementById('svg-wrapper')) {
                svgContainer.style.cursor = 'grab';
            }
        });

        // ── Demo data loader ──────────────────────────────────────────────────
        function _makeFile(content, name, type) {
            const blob = new Blob([content], { type });
            return new File([blob], name, { type });
        }

        function _setFileInput(inputId, file, tagId) {
            const input = document.getElementById(inputId);
            const dt = new DataTransfer();
            dt.items.add(file);
            input.files = dt.files;
            if (tagId) document.getElementById(tagId).style.display = 'inline';
        }

        async function loadDemo() {
            document.getElementById('demo_btn').disabled = true;
            setStatus('Loading demo data…');
            try {
                const [newick, cloneMap, colorMap] = await Promise.all([
                    fetch('demo/demo.nwk').then(r => r.text()),
                    fetch('demo/demo_clone_map.tsv').then(r => r.text()),
                    fetch('demo/demo_color_map.txt').then(r => r.text()),
                ]);
                _setFileInput('newick_file', _makeFile(newick,    'demo.nwk',            'text/plain'),                   'tag-newick');
                _setFileInput('clone_map',   _makeFile(cloneMap,  'demo_clone_map.tsv',   'text/tab-separated-values'),   'tag-clone');
                _setFileInput('color_map',   _makeFile(colorMap,  'demo_color_map.txt',   'text/plain'),                  'tag-color');
                setStatus('Demo data loaded — click Run Pipeline to generate the tree.', 'ready');
            } catch (err) {
                setStatus('Failed to load demo: ' + err.message, 'error');
            }
            document.getElementById('demo_btn').disabled = false;
        }

        // ── File reader helper ────────────────────────────────────────────────
        async function readFile(fileInputElement) {
            const file = fileInputElement.files[0];
            if (!file) return null;
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsText(file);
            });
        }

        // ── Load JSON plot ────────────────────────────────────────────────────
        document.getElementById('load_json_btn').addEventListener('click', () => {
            const fileInput = document.getElementById('load_json_input');
            const file = fileInput.files[0];
            if (!file) { alert('Please select a JSON file first.'); return; }
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const plotData = JSON.parse(e.target.result);
                    if (!plotData.svg) throw new Error('No SVG data found in file.');
                    showPlot(plotData.svg);
                    setStatus('Plot loaded from JSON.', 'ready');
                } catch (err) {
                    alert('Failed to load JSON: ' + err.message);
                }
            };
            reader.readAsText(file);
        });

        // ── Pyodide init ──────────────────────────────────────────────────────
        let pyodide;

        async function init() {
            try {
                setStatus('Loading Pyodide runtime…');
                pyodide = await loadPyodide();
                setStatus('Loading Python packages (pandas, matplotlib)…');
                await pyodide.loadPackage(['pandas', 'matplotlib']);

                setStatus('Downloading pipeline scripts…');
                const filesToLoad = [
                    'tree_pipeline.py',
                    'newick_to_grapetree.py',
                    'grapetree_auxiliary_functions_v7.py',
                    'dan_auxiliary_functions.py',
                    'defaults.csv'
                ];
                for (const file of filesToLoad) {
                    const response = await fetch(file);
                    const content  = await response.text();
                    pyodide.FS.writeFile(file, content);
                }

                setStatus('Ready!', 'ready');
                document.getElementById('run_btn').disabled  = false;
                document.getElementById('demo_btn').disabled = false;
            } catch (err) {
                console.error(err);
                setStatus('Error initializing: ' + err.message, 'error');
            }
        }

        // ── Run pipeline ──────────────────────────────────────────────────────
        document.getElementById('run_btn').addEventListener('click', async () => {
            setStatus('Running pipeline…');
            document.getElementById('run_btn').disabled  = true;
            document.getElementById('demo_btn').disabled = true;
            const container = document.getElementById('svg-container');
            container.innerHTML = '<i style="padding:20px;">Running…</i>';
            container.classList.add('empty');
            container.style.cursor = 'default';
            document.getElementById('plot-toolbar').style.display = 'none';
            _resetProgress();

            try {
                try { pyodide.FS.mkdir('/work'); } catch(e) {}

                let args = ['tree_pipeline.py', '--output', '/work/annotated.svg', '--force'];

                const newickContent = await readFile(document.getElementById('newick_file'));
                if (!newickContent) {
                    alert('Newick file is required!');
                    setStatus('Ready!', 'ready');
                    document.getElementById('run_btn').disabled  = false;
                    document.getElementById('demo_btn').disabled = false;
                    container.innerHTML = '<i>Output will appear here.</i>';
                    document.getElementById('progress-section').style.display = 'none';
                    return;
                }
                pyodide.FS.writeFile('/work/input.nwk', newickContent);
                args.push('--newick', '/work/input.nwk');

                const cloneMapContent = await readFile(document.getElementById('clone_map'));
                if (cloneMapContent) {
                    pyodide.FS.writeFile('/work/clone_map.tsv', cloneMapContent);
                    args.push('--clone_map', '/work/clone_map.tsv');
                }

                const colorMapContent = await readFile(document.getElementById('color_map'));
                if (colorMapContent) {
                    pyodide.FS.writeFile('/work/color_map.txt', colorMapContent);
                    args.push('--color_map', '/work/color_map.txt');
                }

                const cgmlstContent = await readFile(document.getElementById('cgmlst_file'));
                if (cgmlstContent) {
                    pyodide.FS.writeFile('/work/cgmlst.tsv', cgmlstContent);
                    args.push('--cgmlst', '/work/cgmlst.tsv');
                }

                const batchesContent = await readFile(document.getElementById('batches_file'));
                if (batchesContent) {
                    pyodide.FS.writeFile('/work/batches.tsv', batchesContent);
                    args.push('--batches', '/work/batches.tsv');
                }

                const width = document.getElementById('width').value;
                if (width)   { args.push('--width',    width);   }
                const height = document.getElementById('height').value;
                if (height)  { args.push('--height',   height);  }
                const legendX = document.getElementById('legend_x').value;
                if (legendX) { args.push('--legend_x', legendX); }
                const legendY = document.getElementById('legend_y').value;
                if (legendY) { args.push('--legend_y', legendY); }
                const branchFontSize = document.getElementById('branch_font_size').value;
                if (branchFontSize) { args.push('--branch_font_size', branchFontSize); }
                const nodeFontSize = document.getElementById('node_font_size').value;
                if (nodeFontSize)   { args.push('--node_font_size',   nodeFontSize);   }
                const branchStrokeWidth = document.getElementById('branch_stroke_width').value;
                if (branchStrokeWidth) { args.push('--branch_stroke_width', branchStrokeWidth); }
                const distanceScale = document.getElementById('distance_scale').value;
                if (distanceScale) { args.push('--distance_scale', distanceScale); }
                if (document.getElementById('remove_samples_text').checked) {
                    args.push('--remove_samples_text');
                }

                // Capture Python stdout → progress UI
                pyodide.globals.set('sys_argv', args);
                await pyodide.runPythonAsync(`
import sys
import tree_pipeline
from js import updatePipelineProgress

class _UIWriter:
    def write(self, text):
        for line in text.split('\\n'):
            if line.strip():
                updatePipelineProgress(line.strip())
    def flush(self): pass

_orig = sys.stdout
sys.stdout = _UIWriter()
try:
    sys.argv = sys_argv.to_py()
    tree_pipeline.main()
except SystemExit as e:
    if e.code != 0:
        raise Exception(f"SystemExit: {e.code}")
finally:
    sys.stdout = _orig
`);

                const svgContent = pyodide.FS.readFile('/work/annotated.svg', { encoding: 'utf8' });
                showPlot(svgContent);
                setStatus('Done!', 'ready');

            } catch (err) {
                console.error(err);
                setStatus('Error: ' + err.message, 'error');
                container.innerHTML =
                    '<i style="color:red; padding:20px;">Error occurred. Check the browser console for details.</i>';
                container.classList.add('empty');
                container.style.cursor = 'default';
                document.getElementById('progress-section').style.display = 'none';
            }

            document.getElementById('run_btn').disabled  = false;
            document.getElementById('demo_btn').disabled = false;
        });

        document.getElementById('demo_btn').addEventListener('click', loadDemo);

        init();
    </script>
</body>
</html>
